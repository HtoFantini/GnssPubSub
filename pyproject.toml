[tool.poetry]
name = "gpspublisher"
version = "0.0.0"
description = "Read and publish gps data from a device"
authors = ["Henrique Tropia De Oliveira Fantini <henrique@harpia.tec.br>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-coverage = "^0.0"
python-semantic-release = "^9.8.5"
tox-poetry-installer = "^0.10.3"

[build-system]
requires = ["poetry-core", "setuptools>=42.0", "wheel"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-s -v --no-cov"
testpaths = ["tests"]
pythonpath = ['src']

[tool.coverage.run]
source = ["gpspublisher"]
omit = [
]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version = "0.1.1"
update_changelog_on_bump = true
major_version_zero = true